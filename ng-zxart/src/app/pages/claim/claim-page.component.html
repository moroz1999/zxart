<zx-page-layout>
  <h1 zxPageHeader appHeading="display">{{ 'author-details.action.claim' | translate }}</h1>
  <zx-stack spacing="lg">
    <ng-container *ngIf="!done; else result">
      <p>{{ 'claim.intro' | translate }}</p>

    <zx-form-message *ngIf="errorMessage" variant="error">{{ errorMessage | translate }}</zx-form-message>

    <zx-form-actions align="start">
      <zx-button color="primary" [disabled]="submitting" (click)="onConfirm()">{{ 'claim.confirm' | translate }}</zx-button>
    </zx-form-actions>
    </ng-container>

    <ng-template #result>
      <zx-form-message [variant]="succeeded ? 'success' : 'error'">
        {{ (succeeded ? 'claim.sent' : 'claim.failed') | translate }}
      </zx-form-message>
    </ng-template>
  </zx-stack>
</zx-page-layout>
