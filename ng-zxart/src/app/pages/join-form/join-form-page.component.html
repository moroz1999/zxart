<zx-page-layout>
  <h1 zxPageHeader appHeading="display">{{ 'join-form.submit' | translate }}</h1>
  <form zxForm [formGroup]="form" (ngSubmit)="onSubmit()">
    <zx-stack spacing="lg">
    <zx-form-field *ngFor="let picker of pickers">
      <zx-form-label>{{ picker.labelKey | translate }}</zx-form-label>
      <zx-form-control>
        <zx-entity-autocomplete [formControlName]="picker.field" [types]="picker.types" [placeholder]="'join-form.search' | translate"></zx-entity-autocomplete>
      </zx-form-control>
    </zx-form-field>

    <zx-form-field *ngFor="let checkbox of checkboxes">
      <zx-checkbox-field [formControlName]="checkbox.field" [label]="checkbox.labelKey | translate"></zx-checkbox-field>
    </zx-form-field>

    <zx-form-message *ngIf="errorMessage" variant="error">{{ errorMessage | translate }}</zx-form-message>

    <zx-form-actions align="start">
      <zx-button color="primary" type="submit" [disabled]="submitting">{{ 'join-form.submit' | translate }}</zx-button>
    </zx-form-actions>
    </zx-stack>
  </form>
</zx-page-layout>
