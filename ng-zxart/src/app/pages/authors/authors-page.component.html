<ng-container *ngIf="vm$ | async as vm">
  <zx-page-layout>
    <h1 zxPageHeader appHeading="display">{{ vm.titleKey | translate }}</h1>
    @if (vm.dashboard && (vm.items === 'graphics' || vm.items === 'music')) {
      <zx-authors-dashboard [items]="vm.items" [basePath]="vm.basePath"></zx-authors-dashboard>
    } @else {
      <zx-author-browser
        [items]="vm.items"
        [basePath]="vm.basePath"
        [letter]="vm.letter"
        [manageUrl]="false"
      ></zx-author-browser>
    }
  </zx-page-layout>
</ng-container>
