<zx-page-layout>
  <h1 zxPageHeader appHeading="display">{{ messageKey | translate }}</h1>
  <zx-stack spacing="lg">
    <zx-form-message *ngIf="errorMessage" variant="error">{{ errorMessage | translate }}</zx-form-message>
    <zx-form-actions align="start">
      <zx-button color="primary" [disabled]="submitting" (click)="onConfirm()">{{ 'convert-form.confirm' | translate }}</zx-button>
    </zx-form-actions>
  </zx-stack>
</zx-page-layout>
