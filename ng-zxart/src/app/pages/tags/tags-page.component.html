<zx-page-layout *ngIf="vm$ | async as vm">
  <h1 zxPageHeader appHeading="display">{{ vm.titleKey | translate }}</h1>
  <zx-tags-cloud
    [section]="vm.section"
    [searchBasePath]="vm.searchBasePath"
    [tagQueryParam]="vm.tagQueryParam"
    [tagQueryValue]="vm.tagQueryValue"
  ></zx-tags-cloud>
</zx-page-layout>
