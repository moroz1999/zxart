<zx-page-layout>
  <h1 zxPageHeader appHeading="display">{{ 'top-music.title' | translate }}</h1>
  <zx-nav-chips *ngIf="chips$ | async as chips" [chips]="chips" size="md"></zx-nav-chips>
  <zx-music-browser
    childParamName="filter"
    fixedSorting="votes,desc"
    [showSorting]="false"
  ></zx-music-browser>
</zx-page-layout>
