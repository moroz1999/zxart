<ng-container *ngIf="(elementId$ | async) ?? 0 as elementId">
  <section class="playlist">
    <zx-pictures-list-inline [elementId]="elementId"></zx-pictures-list-inline>
    <zx-music-list-inline [elementId]="elementId"></zx-music-list-inline>
    <zx-prods-list [elementId]="elementId" property="prods"></zx-prods-list>
  </section>
</ng-container>
