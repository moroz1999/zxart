<zx-hero media="xs">
  <div zxHeroMedia>
    <img *ngIf="core.imageUrl" [src]="core.imageUrl" [alt]="core.title" class="gp-header__avatar-img"/>
    <div *ngIf="!core.imageUrl" class="gp-avatar--empty">
      <svg-icon name="person" aria-hidden="true"></svg-icon>
    </div>
  </div>

  <zx-hero-title [title]="core.title" [entityId]="core.id">
    <zx-chip *ngFor="let nature of core.nature" variant="opaque" [color]="natureColor(nature)">
      {{ 'group-details.nature.' + nature | translate }}
    </zx-chip>

    <zx-group-editing-controls
      zxHeroEdit
      [elementId]="core.id"
      [entityType]="core.entityType">
    </zx-group-editing-controls>
  </zx-hero-title>

  <zx-facts>
    <zx-fact *ngIf="core.abbreviation">
      <zx-chip variant="mono">{{ core.abbreviation }}</zx-chip>
    </zx-fact>

    <zx-fact *ngIf="core.type && core.type !== 'unknown'">
      {{ 'group-details.type.' + core.type | translate }}
    </zx-fact>

    <zx-fact *ngIf="core.location.city || core.location.country">
      <zx-location [city]="core.location.city" [country]="core.location.country"></zx-location>
    </zx-fact>

    <zx-fact *ngIf="core.years">
      <zx-chip variant="mono">{{ core.years }}</zx-chip>
    </zx-fact>
  </zx-facts>

  <p *ngIf="core.slogan" appText="body" tone="muted" class="gp-header__slogan">{{ core.slogan }}</p>

  <zx-meta-row *ngIf="core.parentGroups.length" [label]="'group-details.header.parent-groups' | translate">
    <zx-chip *ngFor="let parent of core.parentGroups" variant="filled" color="primary" [href]="parent.url">
      {{ parent.title }}
    </zx-chip>
  </zx-meta-row>

  <zx-meta-row *ngIf="core.aliases.length" [label]="'group-details.header.aliases' | translate">
    <span *ngFor="let alias of core.aliases; let last = last" class="gp-aliases__item">
      <a [routerLink]="alias.url">{{ alias.title }}</a><ng-container *ngIf="!last">,</ng-container>
    </span>
  </zx-meta-row>

  <zx-meta-row *ngIf="core.links.length" [label]="'group-details.header.links' | translate">
    <zx-ext-links [links]="core.links"></zx-ext-links>
  </zx-meta-row>
</zx-hero>
