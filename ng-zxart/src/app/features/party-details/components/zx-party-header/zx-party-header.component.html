<zx-hero media="sm">
  <img zxHeroMedia [src]="core.imageUrl" [alt]="core.title" class="pp-header__logo-img"/>

  <zx-hero-title [title]="core.title" [entityId]="core.id">
    <zx-party-editing-controls
      zxHeroEdit
      [elementId]="core.id"
    ></zx-party-editing-controls>
  </zx-hero-title>

  <zx-facts>
    <zx-fact *ngIf="core.abbreviation">
      <zx-chip variant="mono">{{ core.abbreviation }}</zx-chip>
    </zx-fact>

    <zx-fact *ngIf="core.location.city || core.location.country">
      <zx-location [city]="core.location.city" [country]="core.location.country"></zx-location>
    </zx-fact>

    <zx-fact *ngIf="core.year">
      <zx-chip variant="mono">{{ core.year }}</zx-chip>
    </zx-fact>
  </zx-facts>

  <zx-meta-row *ngIf="core.links.length" [label]="'party-details.header.links' | translate">
    <zx-ext-links [links]="core.links"></zx-ext-links>
  </zx-meta-row>

  <zx-hero-bar zxHeroBar>
    <zx-counters zxHeroBarCounters [items]="counters"></zx-counters>

    <zx-button-controls zxHeroBarActions align="end" [wrap]="true" gap="sm">
      <zx-download-button
        color="secondary"
        [href]="core.zipUrl"
        [label]="'party-details.header.download-zip' | translate">
      </zx-download-button>
    </zx-button-controls>
  </zx-hero-bar>
</zx-hero>
