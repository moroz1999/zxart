<ng-container *ngIf="details$ | async as details; else loading">
  <zx-hero media="auto">
    <zx-picture-viewer zxHeroMedia [picture]="details"></zx-picture-viewer>

    <zx-hero-title [title]="details.title" [entityId]="details.id" [year]="details.year">
      <zx-picture-editing-controls zxHeroEdit [elementId]="details.id"></zx-picture-editing-controls>
    </zx-hero-title>

    <zx-inline spacing="sm" align="center" [wrap]="true">
      <zx-chip variant="mono" [href]="formatSearchUrl(details)">{{ details.formatLabel }}</zx-chip>
      <zx-chip *ngIf="details.resolution" variant="mono-outline">{{ details.resolution }}</zx-chip>
    </zx-inline>

    <zx-credits-row [groups]="creditGroups(details)"></zx-credits-row>

    <zx-callout *ngIf="details.partyContext || details.prodContext">
      <zx-party-provenance *ngIf="details.partyContext" [party]="details.partyContext"></zx-party-provenance>
      <zx-prod-context *ngIf="details.prodContext" [context]="details.prodContext"></zx-prod-context>
    </zx-callout>

    <div *ngIf="details.description" class="picture-details__description" appText="body" tone="primary">{{ details.description }}</div>

    <zx-added-by
      *ngIf="details.dateCreated"
      [dateAdded]="details.dateCreated"
      [submitter]="details.submitter">
    </zx-added-by>

    <zx-hero-bar zxHeroBar>
      <zx-item-controls
        [elementId]="details.id"
        type="zxPicture"
        [votes]="details.votes"
        [votesAmount]="details.votesAmount"
        [userRating]="details.userVote"
        [denyVoting]="details.denyVoting">
      </zx-item-controls>

      <zx-counters zxHeroBarCounters [items]="counters(details)"></zx-counters>

      <zx-button-controls zxHeroBarActions align="end" [wrap]="true" gap="sm">
        <zx-download-button
          *ngIf="primaryDownload(details) as download"
          rel="nofollow"
          [href]="download.url"
          [label]="download.label">
        </zx-download-button>
      </zx-button-controls>
    </zx-hero-bar>
  </zx-hero>

  <zx-stack spacing="xl">
    <!-- Tags (reusable list with quick-form editing, as in prod) -->
    <zx-panel>
      <zx-tags-list
        [tags]="details.tags"
        [elementId]="details.id"
        tagBasePath="/pictures/tags"
        [label]="'picture-details.tags' | translate"
        [editAriaLabel]="'tags-quick-form.title' | translate"
      ></zx-tags-list>
    </zx-panel>

    <!-- Meta + downloads -->
    <zx-grid [desktopColumns]="'2'" [mobileColumns]="'1'" gap="xl" align="start">
      <zx-picture-meta-panel [picture]="details"></zx-picture-meta-panel>
      <zx-picture-downloads-panel
        *ngIf="details.downloads.length"
        [downloads]="details.downloads">
      </zx-picture-downloads-panel>
    </zx-grid>

    <zx-picture-materials-section
      *ngIf="details.materials.length"
      [materials]="details.materials">
    </zx-picture-materials-section>

    <zx-picture-stages-section
      *ngIf="details.sequenceUrl"
      [sequenceUrl]="details.sequenceUrl">
    </zx-picture-stages-section>

    <!-- Mentions -->
    <zx-panel *ngIf="details.mentions.length" [title]="'picture-details.mentions' | translate" titleLevel="h3">
      <zx-stack spacing="xs">
        <a *ngFor="let mention of details.mentions" [routerLink]="mention.url" appText="body" tone="link">
          {{ mention.title }}
        </a>
      </zx-stack>
    </zx-panel>

    <!-- Votes + comments -->
    <zx-grid desktopColumns="5" mobileColumns="1" gap="xl" align="start">
      <zx-stack zxGridItem zxGridDesktopSpan="2" spacing="sm">
        <zx-ratings-list-view [elementId]="details.id"></zx-ratings-list-view>
        <p *ngIf="details.denyVoting" appText="caption" tone="muted">
          {{ 'picture-details.voting-denied' | translate }}
        </p>
      </zx-stack>
      <zx-comments-list-view zxGridItem zxGridDesktopSpan="3" [elementId]="details.id"></zx-comments-list-view>
    </zx-grid>

    <zx-picture-related-section [pictureId]="details.id"></zx-picture-related-section>
  </zx-stack>
</ng-container>

<ng-template #loading>
  <zx-picture-details-skeleton></zx-picture-details-skeleton>
</ng-template>
