<zx-picture-gallery-host></zx-picture-gallery-host>

<zx-stack spacing="xl">
  <section *ngFor="let group of groups; trackBy: trackByKind">
    <zx-release-section-head
      [titleKey]="'covers.' + group.kind"
      [count]="group.items.length">
    </zx-release-section-head>

    <zx-inline spacing="sm" align="start" [wrap]="true">
      <figure
        *ngFor="let cover of group.items; trackBy: trackById"
        class="release-inlays-section__item"
      >
        <div class="release-inlays-section__thumb-wrap">
          <img
            *ngIf="cover.imageUrl"
            class="release-inlays-section__thumb"
            loading="lazy"
            [src]="cover.imageUrl"
            [alt]="cover.title"
            [lightbox]="galleryPosition(cover)"
            [gallery]="galleryId"
          />
          <div class="release-inlays-section__controls">
            <zx-button
              size="xs"
              color="secondary"
              [href]="cover.downloadUrl"
              [attr.aria-label]="'prod-details.screenshot-download' | translate"
            ><svg-icon name="download" class="release-inlays-section__btn-icon"></svg-icon></zx-button>
          </div>
        </div>
      </figure>
    </zx-inline>
  </section>
</zx-stack>
