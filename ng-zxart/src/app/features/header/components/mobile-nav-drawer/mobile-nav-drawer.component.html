<div class="mn-drawer-header">
  <div class="mn-tools">
    <zx-button
      color="transparent"
      [square]="true"
      [ariaLabel]="'header.mobile-nav.ratings' | translate"
      (click)="openRatings()"
    >
      <svg-icon name="mn-star" class="mn-icon"></svg-icon>
    </zx-button>
    <zx-button
      color="transparent"
      [square]="true"
      [ariaLabel]="'header.mobile-nav.comments' | translate"
      (click)="openComments()"
    >
      <svg-icon name="mn-chat" class="mn-icon"></svg-icon>
    </zx-button>
    <zx-theme-trigger></zx-theme-trigger>
    <zx-picture-settings-trigger></zx-picture-settings-trigger>
  </div>
  <zx-button
    color="transparent"
    [square]="true"
    [ariaLabel]="'header.mobile-nav.close' | translate"
    (click)="close()"
  >
    <svg-icon name="mn-x" class="mn-icon"></svg-icon>
  </zx-button>
</div>

<div class="mn-items">
  @for (item of items; track item.url) {
    <zx-popover-menu-item [href]="item.url" [queryParams]="item.queryParams ?? null" [active]="isActive(item)">
      {{ item.labelKey ? (item.labelKey | translate) : item.label }}
    </zx-popover-menu-item>
    @if (item.children.length > 0 && isActive(item)) {
      <div class="mn-submenu">
        @for (child of item.children; track child.url) {
          <zx-popover-menu-item [href]="child.url" [queryParams]="child.queryParams ?? null">
            {{ child.labelKey ? (child.labelKey | translate) : child.label }}
          </zx-popover-menu-item>
        }
      </div>
    }
  }
</div>
