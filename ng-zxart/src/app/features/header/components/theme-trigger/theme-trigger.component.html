<zx-button
  color="transparent"
  [square]="true"
  [ariaLabel]="'header.theme-trigger.label' | translate"
  (click)="toggle()"
>
  @if ((themePreference$ | async) === null) {
    <svg-icon name="theme-auto" class="tt-icon"></svg-icon>
  } @else {
    <svg-icon name="theme" class="tt-icon"></svg-icon>
  }
</zx-button>
