<ng-container *ngIf="state$ | async as state">
  <zx-press-details-skeleton *ngIf="state.loading"></zx-press-details-skeleton>

  <div *ngIf="state.error" appText="body" tone="danger">{{ 'press-details.error-load' | translate }}</div>

  <zx-sidebar-layout *ngIf="state.article as vm">
    <zx-press-issue-nav
      *ngIf="vm.details.publication"
      zxSidebar
      [publication]="vm.details.publication"
      [currentArticleId]="vm.details.id"
    ></zx-press-issue-nav>

    <zx-stack spacing="xl">
      <zx-stack spacing="sm">
        <zx-meta-row *ngIf="vm.externalLinks.length" [label]="'press-details.source' | translate">
          <zx-ext-links [links]="vm.externalLinks"></zx-ext-links>
        </zx-meta-row>

        <zx-meta-row *ngIf="vm.details.tags.length" [label]="'press-details.tags' | translate">
          <zx-chips [items]="vm.details.tags"></zx-chips>
        </zx-meta-row>
      </zx-stack>

      <zx-panel
        *ngIf="vm.mentionGroups.length"
        variant="flat"
        radius="lg"
        [title]="'press-details.mentions' | translate"
        titleLevel="h2"
      >
        <zx-stack spacing="lg">
          <zx-meta-row
            *ngFor="let group of vm.mentionGroups; trackBy: trackByGroup"
            [label]="group.labelKey | translate"
          >
            <zx-chips [items]="group.items"></zx-chips>
          </zx-meta-row>
        </zx-stack>
      </zx-panel>

      <zx-panel *ngIf="vm.details.introduction" variant="flat" radius="lg">
        <zx-meta-row [label]="'press-details.introduction' | translate">
          <div appText="body" tone="primary" [innerHTML]="vm.details.introduction"></div>
        </zx-meta-row>
      </zx-panel>

      <zx-preformatted
        *ngIf="vm.details.content"
        [content]="vm.details.content"
        [html]="true"
      ></zx-preformatted>

      <zx-grid *ngIf="vm.previous || vm.next" desktopColumns="2" mobileColumns="1" gap="md">
        <zx-callout
          *ngIf="vm.previous"
          accent="none"
          surface="raised"
          [bordered]="true"
          [href]="vm.previous.url"
          [label]="'press-details.previous-article' | translate"
        ><span appText="body" tone="strong">{{ vm.previous.title }}</span></zx-callout>

        <zx-callout
          *ngIf="vm.next"
          accent="none"
          surface="raised"
          [bordered]="true"
          [href]="vm.next.url"
          [label]="'press-details.next-article' | translate"
        ><span appText="body" tone="strong">{{ vm.next.title }}</span></zx-callout>
      </zx-grid>

      <zx-comments-list-view [elementId]="vm.details.id"></zx-comments-list-view>
    </zx-stack>
  </zx-sidebar-layout>
</ng-container>
