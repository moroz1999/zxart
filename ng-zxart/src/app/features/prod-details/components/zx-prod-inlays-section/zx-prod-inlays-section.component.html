<zx-stack
  spacing="lg"
  [appInViewport]="!loaded && !loading"
  (inViewport)="onInViewport()"
>
  <zx-picture-grid-skeleton *ngIf="loading" [count]="2"></zx-picture-grid-skeleton>

  <ng-container *ngIf="loaded && groups.length > 0">
    <zx-picture-gallery-host></zx-picture-gallery-host>

    <zx-stack spacing="md" *ngFor="let group of groups; trackBy: trackByKind">
      <h2 appHeading="headline">{{ 'covers.' + group.kind | translate }}</h2>

      <div class="prod-inlays-section__grid">
        <zx-inlay-tile
          *ngFor="let cover of group.items; trackBy: trackById"
          [inlay]="cover"
          [showReleaseInfo]="true"
          (imageClick)="openCover(cover)"
        ></zx-inlay-tile>
      </div>
    </zx-stack>
  </ng-container>
</zx-stack>
