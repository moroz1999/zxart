<zx-hero [media]="core.youtubeId ? 'xl' : 'none'">
  <zx-youtube-embed
    *ngIf="core.youtubeId"
    zxHeroMedia
    [youtubeId]="core.youtubeId">
  </zx-youtube-embed>

  <zx-hero-title [title]="core.title" [entityId]="core.elementId" [year]="core.year">
    <zx-prod-editing-controls
      zxHeroEdit
      [elementId]="core.elementId"
    ></zx-prod-editing-controls>
  </zx-hero-title>

  <zx-facts *ngIf="core.altTitle">
    <zx-fact>{{ 'prod-details.altTitle' | translate }} {{ core.altTitle }}</zx-fact>
  </zx-facts>

  <zx-inline *ngIf="leafCategories.length || core.languages.length || showLegalStatus" spacing="sm" align="center" [wrap]="true">
    <zx-chip *ngFor="let cat of leafCategories" variant="filled" color="primary" [href]="'/prods?cat=' + cat.id">{{ cat.title }}</zx-chip>
    <zx-chip *ngFor="let lang of core.languages" variant="filled" color="neutral" [href]="'/prods?languages=' + lang.code">{{ lang.emoji }} {{ 'language.' + lang.code | translate }}</zx-chip>
    <zx-chip *ngIf="showLegalStatus" variant="filled" color="neutral">{{ core.legalStatusLabel }}</zx-chip>
  </zx-inline>

  <zx-prod-people-row
    [authors]="core.authors"
    [publishers]="core.publishers"
    [groups]="core.groups">
  </zx-prod-people-row>

  <zx-callout *ngIf="core.party">
    <zx-party-provenance [party]="core.party"></zx-party-provenance>
  </zx-callout>

  <zx-meta-row *ngIf="externalLinks.length" [label]="'prod-details.links' | translate">
    <zx-ext-links [links]="externalLinks"></zx-ext-links>
  </zx-meta-row>

  <zx-added-by
    [dateAdded]="core.dateCreated"
    [submitter]="core.submitter">
  </zx-added-by>

  <zx-hero-bar zxHeroBar>
    <zx-item-controls
      [elementId]="core.elementId"
      type="zxProd"
      [votes]="core.voting.votes"
      [votesAmount]="core.voting.votesAmount"
      [userRating]="core.voting.userVote"
      [denyVoting]="core.voting.denyVoting">
    </zx-item-controls>

    <zx-counters zxHeroBarCounters [items]="counters"></zx-counters>

    <zx-button-controls zxHeroBarActions align="end" [wrap]="true" gap="sm">
      <zx-button
        *ngIf="showDonateButton"
        color="secondary"
        [href]="core.externalLink"
        target="_blank"
        rel="noopener">
        <svg-icon class="hero-cta-icon" name="dollar"></svg-icon>{{ 'prod-details.donate' | translate }}
      </zx-button>

      <zx-button
        *ngIf="showBuyButton"
        color="secondary"
        [href]="core.externalLink"
        target="_blank"
        rel="noopener">
        <svg-icon class="hero-cta-icon" name="cart"></svg-icon>{{ 'prod-details.purchase' | translate }}
      </zx-button>
    </zx-button-controls>
  </zx-hero-bar>
</zx-hero>
