<zx-stack
  spacing="md"
  [appInViewport]="!loaded && !loading"
  (inViewport)="onInViewport()"
>
  <zx-article-preview-skeleton
    *ngIf="loading"
    [count]="3"
    [withImage]="true"
    [withReadLink]="true"
  ></zx-article-preview-skeleton>

  <zx-press-mentions-list
    *ngIf="loaded && mentions.length > 0"
    [articles]="mentions"
    [readLinkLabel]="'prod-details.readArticle' | translate">
  </zx-press-mentions-list>
</zx-stack>
