<zx-stack
  spacing="md"
  [appInViewport]="!loaded && !loading"
  (inViewport)="onInViewport()"
>
  <ng-container *ngIf="loading || (loaded && hasContent)">
    <h2 appHeading="headline">{{ 'prod-details.maps' | translate }}</h2>

    <zx-picture-grid-skeleton *ngIf="loading" [count]="2"></zx-picture-grid-skeleton>

    <ng-container *ngIf="loaded">
      <zx-button
        *ngIf="mapsUrl"
        size="sm"
        color="outlined"
        [href]="mapsUrl"
        target="_blank"
        class="prod-maps-section__speccymaps"
      >{{ 'prod-details.speccymaps' | translate }}</zx-button>

      <ng-container *ngIf="files.length > 0">
        <zx-picture-gallery-host></zx-picture-gallery-host>

        <zx-inline spacing="lg" align="start" [wrap]="true">
          <zx-inlay-tile
            *ngFor="let file of files; let i = index; trackBy: trackById"
            [inlay]="file"
            [caption]="file.author"
            (imageClick)="openMap(i)"
          ></zx-inlay-tile>
        </zx-inline>
      </ng-container>
    </ng-container>
  </ng-container>
</zx-stack>
