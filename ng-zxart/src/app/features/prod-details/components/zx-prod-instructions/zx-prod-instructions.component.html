<ng-container *ngIf="data$ | async as data">
  <zx-stack spacing="sm">
    <h3 appHeading="title">{{ 'prod-details.instructions' | translate }}</h3>
    <div *ngIf="data.htmlInstructions; else plainText" appText="body" tone="primary" [innerHTML]="data.instructions"></div>
    <ng-template #plainText>
      <zx-preformatted [content]="data.instructions" appText="mono" tone="primary"></zx-preformatted>
    </ng-template>
  </zx-stack>
</ng-container>
