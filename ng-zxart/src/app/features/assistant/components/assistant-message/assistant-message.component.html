<zx-stack gap="xs" [align]="message.role === 'user' ? 'end' : 'start'">
  @switch (message.kind) {
    @case ('text') {
      @if (message.role === 'user') {
        <zx-panel class="am-bubble" variant="flat" surface="primary" radius="lg" padding="sm">
          <div appText="body" tone="primary"><zx-assistant-text [segments]="message.segments"></zx-assistant-text></div>
        </zx-panel>
      } @else {
        <zx-panel class="am-bubble" variant="flat" surface="muted" radius="lg" padding="sm">
          @if (message.html !== null) {
            <zx-assistant-markdown [html]="message.html"></zx-assistant-markdown>
          } @else {
            <div appText="body" tone="primary"><zx-assistant-text [segments]="message.segments"></zx-assistant-text></div>
          }
        </zx-panel>
      }
    }
    @case ('plan') {
      @if (message.plan) {
        <zx-assistant-plan class="am-plan" [plan]="message.plan" (approve)="approve.emit($event)" (cancelPlan)="cancelPlan.emit($event)"></zx-assistant-plan>
      }
    }
    @default {
      <div appText="bodySm" [tone]="message.kind === 'error' ? 'danger' : 'muted'">
        <zx-assistant-text [segments]="message.segments"></zx-assistant-text>
      </div>
    }
  }
  @if (message.details) {
    <zx-button size="xs" color="transparent" (click)="toggleDetails()" [attr.aria-expanded]="detailsOpen">
      <svg-icon [name]="detailsOpen ? 'expand-less' : 'expand-more'" class="am-icon" aria-hidden="true"></svg-icon>
      <span appText="caption" tone="muted">{{ 'assistant.details' | translate }}</span>
    </zx-button>
  }
  @if (detailsOpen && message.details) {
    <zx-panel class="am-details" variant="flat" surface="muted" radius="lg" padding="sm">
      <zx-preformatted class="am-details-text" appText="mono" [content]="message.details"></zx-preformatted>
    </zx-panel>
  }
</zx-stack>
