<zx-stack gap="md">
  @if (groups.length === 0) {
    <div appText="bodySm" tone="muted">{{ 'assistant.no-conversations' | translate }}</div>
  }
  @for (group of groups; track group.day) {
    <zx-stack gap="xs">
      <zx-inset padding="sm" side="inline">
        <span appText="bodySm" tone="muted">{{ 'assistant.day.' + group.day | translate }}</span>
      </zx-inset>
      @for (conversation of group.conversations; track conversation.id) {
        <zx-list-item
          [title]="conversation.title || ('assistant.untitled' | translate)"
          [subtitle]="(conversation.lastMessageAt * 1000 | date: (group.day === 'earlier' ? 'd MMM' : 'shortTime')) ?? ''"
          [active]="conversation.id === currentId"
          (picked)="picked.emit(conversation.id)"
        >
          @if (conversation.running) {
            <zx-spinner size="xs"></zx-spinner>
          } @else {
            <zx-button
              size="sm"
              color="transparent"
              [square]="true"
              [ariaLabel]="'assistant.delete' | translate"
              (click)="deleted.emit(conversation)"
            >
              <svg-icon name="delete" class="ac-icon" aria-hidden="true"></svg-icon>
            </zx-button>
          }
        </zx-list-item>
      }
    </zx-stack>
  }
</zx-stack>
