<div class="pgs-stage">
  <div class="pgs-canvas" #canvas>
    @if (displaySize; as size) {
      <zx-pixel-zoom
        [image]="slide.src"
        [fullImage]="slide.zoomSrc"
        [width]="size.width"
        [height]="size.height"
        [alt]="slide.alt"
      ></zx-pixel-zoom>
    }
  </div>
  @if (hasPrevious) {
    <zx-button
      class="pgs-nav pgs-nav--prev"
      color="transparent"
      [square]="true"
      [round]="true"
      [ariaLabel]="'picture-gallery.previous' | translate"
      (click)="previous.emit()"
    ><svg-icon name="chevron-left" class="pgs-nav-icon"></svg-icon></zx-button>
  }
  @if (hasNext) {
    <zx-button
      class="pgs-nav pgs-nav--next"
      color="transparent"
      [square]="true"
      [round]="true"
      [ariaLabel]="'picture-gallery.next' | translate"
      (click)="next.emit()"
    ><svg-icon name="chevron-right" class="pgs-nav-icon"></svg-icon></zx-button>
  }
</div>
@if (slide.info; as info) {
  <zx-picture-gallery-info class="pgs-info" [info]="info"></zx-picture-gallery-info>
}
