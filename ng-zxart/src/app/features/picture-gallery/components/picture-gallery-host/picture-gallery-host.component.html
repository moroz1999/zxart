<ng-template #galleryImageTemplate let-image let-active="active" let-first="first" let-last="last">
  @if (image.info) {
    <zx-picture-gallery-slide [slide]="image" [active]="active" [first]="first" [last]="last"></zx-picture-gallery-slide>
  } @else {
    <zx-picture-gallery-zoom-overlay
      [src]="image.src"
      [thumb]="image.thumb || image.src"
      [active]="active"
    ></zx-picture-gallery-zoom-overlay>
  }
</ng-template>
