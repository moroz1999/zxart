<ng-template #label>
  <ng-content></ng-content>
</ng-template>

@if (isInternal) {
  <a class="pmi-link" [routerLink]="href" [queryParams]="queryParams">
    <ng-container [ngTemplateOutlet]="label"></ng-container>
  </a>
} @else {
  <a class="pmi-link" [href]="href">
    <ng-container [ngTemplateOutlet]="label"></ng-container>
  </a>
}
