@if (title !== '' || icon !== '') {
  <div class="zx-form-section__header">
    @if (icon !== '') {
      <svg-icon [name]="icon" class="zx-form-section__icon" aria-hidden="true"></svg-icon>
    }
    @if (title !== '') {
      <h3 class="zx-form-section__title">{{ title }}</h3>
    }
  </div>
}
<div class="zx-form-section__fields">
  <ng-content></ng-content>
</div>
