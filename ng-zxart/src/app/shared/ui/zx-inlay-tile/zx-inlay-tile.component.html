<div class="inlay-tile__img" (click)="imageClick.emit()">
  <img
    *ngIf="inlay.imageUrl"
    loading="lazy"
    [src]="inlay.imageUrl"
    [alt]="inlay.title"
  />
</div>
<div class="inlay-tile__meta">
  <span class="inlay-tile__title" appText="caption" tone="primary">{{ inlay.title }}</span>
  <span *ngIf="caption" class="inlay-tile__caption" appText="caption" tone="muted">{{ caption }}</span>
  <ng-container *ngIf="releaseInfo as info">
    <a
      *ngIf="info.releaseTitle"
      class="inlay-tile__release"
      [routerLink]="info.releaseUrl"
      appText="caption"
      tone="muted-link"
      (click)="$event.stopPropagation()"
    >{{ info | prodReleaseLabel }}</a>
  </ng-container>
</div>
