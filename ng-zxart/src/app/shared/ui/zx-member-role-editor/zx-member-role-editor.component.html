<div class="zx-member-role-editor">
  <div *ngFor="let member of editable" class="zx-member-role-editor__row">
    <div class="zx-member-role-editor__name">
      {{ member.title }}
      <zx-button size="sm" color="danger" extraClass="zx-member-role-editor__remove" (click)="onRemove(member.id)">×</zx-button>
    </div>

    <div class="zx-member-role-editor__roles">
      <label *ngFor="let role of availableRoles" class="zx-member-role-editor__role">
        <input
          type="checkbox"
          [checked]="hasRole(member.roles, role)"
          (change)="toggleRole(member.roles, role, $any($event.target).checked)"
        />
        {{ roleLabelKey + '.' + role | translate }}
      </label>
    </div>

    <div *ngIf="showDates" class="zx-member-role-editor__dates">
      <zx-input [(ngModel)]="member.startDate" (ngModelChange)="onChanged()" type="text" placeholder="from"></zx-input>
      <zx-input [(ngModel)]="member.endDate" (ngModelChange)="onChanged()" type="text" placeholder="to"></zx-input>
    </div>
  </div>

  <div class="zx-member-role-editor__add">
    <zx-entity-autocomplete
      [(ngModel)]="newAuthor"
      (ngModelChange)="onChanged()"
      [types]="memberTypes"
      placeholder="Add member…"
    ></zx-entity-autocomplete>

    <div *ngIf="newAuthor" class="zx-member-role-editor__roles">
      <label *ngFor="let role of availableRoles" class="zx-member-role-editor__role">
        <input
          type="checkbox"
          [checked]="hasRole(newRoles, role)"
          (change)="toggleRole(newRoles, role, $any($event.target).checked)"
        />
        {{ roleLabelKey + '.' + role | translate }}
      </label>
    </div>

    <div *ngIf="newAuthor && showDates" class="zx-member-role-editor__dates">
      <zx-input [(ngModel)]="newStartDate" (ngModelChange)="onChanged()" type="text" placeholder="from"></zx-input>
      <zx-input [(ngModel)]="newEndDate" (ngModelChange)="onChanged()" type="text" placeholder="to"></zx-input>
    </div>
  </div>
</div>
