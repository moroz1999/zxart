<ng-container *ngFor="let item of items">
  <a *ngIf="item.url" [href]="item.url" class="zx-chips__chip zx-chips__chip--link">{{ item.title }}</a>
  <div *ngIf="!item.url" class="zx-chips__chip">
    <span>{{ item.title }}</span>
    <zx-close-button
      *ngIf="removable"
      size="sm"
      [disabled]="disabled"
      [ariaLabel]="removeAriaLabel"
      (closed)="onRemove(item)"
    ></zx-close-button>
  </div>
</ng-container>
