<zx-button
  [attr.title]="title || ariaLabel || null"
  [attr.aria-expanded]="expanded"
  [ariaLabel]="ariaLabel"
  [routerLink]="routerLink"
  [href]="href"
  [color]="color"
  [size]="size"
  [square]="!label"
  (click)="editClick.emit($event)"
>
  <svg-icon class="zx-edit-button__icon" [name]="icon" aria-hidden="true"></svg-icon>
  @if (label) {
    {{ label }}
  }
</zx-button>
