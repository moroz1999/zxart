<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZX Spectrum Next (MAME tbblue)</title>
  <style>
    body { background: #14161c; color: #d7dae0; font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #9aa0ab; }
    canvas { display: block; background: #000; margin: 0 auto; max-width: 100%; }
    button { font: inherit; padding: 4px 10px; margin-right: 6px; }
    kbd { background: #262a33; border-radius: 3px; padding: 1px 5px; }
  </style>
</head>
<body>
  <h1>ZX Spectrum Next &mdash; MAME <code>tbblue</code></h1>
  <p>
    Boots NextZXOS from <code>software/next.img</code>. Releases are on the card
    under <code>/zxart</code>: open the Browser and walk into it.
    <kbd>DEL</kbd> opens the MAME menu, <kbd>F11</kbd> shows the emulation speed,
    <kbd>F3</kbd> resets the machine.
  </p>
  <p>
    <button onclick="emulator.requestFullScreen()">Full screen</button>
    <label><input type="checkbox" onclick="emulator.toggleMute()"> Mute</label>
  </p>
  <canvas id="canvas"></canvas>

  <script src="es6-promise.js"></script>
  <script src="browserfs.min.js"></script>
  <script src="loader.js"></script>
  <script>
    // ?card=<name> boots another image out of software/, which is how a card
    // built somewhere else is tried here.
    var card = new URLSearchParams(location.search).get('card') || 'next.img';
    // The loader mirrors what it mounts into IndexedDB and never overwrites
    // what is already there, so a rebuilt card would be ignored in favour of
    // the first one ever loaded. The store goes before every run.
    var fsKey = 'zxart-next-page';
    var emulator;

    function start() {
      var loader = new MAMELoader(
        MAMELoader.driver('tbblue'),
        MAMELoader.fileSystemKey(fsKey),
        MAMELoader.nativeResolution(720, 576),
        MAMELoader.emulatorJS('mame.js'),
        MAMELoader.emulatorWASM('mame.wasm'),
        MAMELoader.mountFile('tbblue.zip', MAMELoader.fetchFile('Bios', 'roms/tbblue.zip')),
        MAMELoader.mountFile(card, MAMELoader.fetchFile('SD card', 'software/' + card)),
        MAMELoader.peripheral('hard1', card),
        MAMELoader.extraArgs(['-uimodekey', 'DEL']));
      emulator = new Emulator(document.querySelector('#canvas'), null, loader);
      emulator.start({waitAfterDownloading: false});
    }

    var drop = indexedDB.deleteDatabase(fsKey);
    drop.onsuccess = drop.onerror = drop.onblocked = start;
  </script>
</body>
</html>
