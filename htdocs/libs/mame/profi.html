<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Profi</title>
  </head>
  <body>
    <div id="app"></div>

    <script type="text/javascript" src="mame-loader.js"></script>
    <script type="text/javascript" src="theme-simple.js"></script>
    <script type="text/javascript">
      MAMEThemeSimple.mount(document.getElementById("app"), {
        driver:  "profi",
        files: [
          { url: "roms/profi.zip",        path: "roms/profi.zip" },
          { url: "roms/zxbus_neogs.zip",  path: "roms/zxbus_neogs.zip" },
          { url: "roms/betadisk.zip",     path: "roms/betadisk.zip" },
          { url: "software/MK1.TRD",      path: "MK1.TRD" },
        ],
        args: [
          "-window", "-nounevenstretch", "-video", "bgfx", "-bgfx_screen_chains", "unfiltered",
          "-resolution", "704x592",
          "-zxbus:1", "neogs",
          "-flop1", "MK1.TRD"
        ],
        nmi: true,
      });
    </script>
  </body>
</html>
