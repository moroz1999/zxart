<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>SAM Coupé</title>
  </head>
  <body>
    <div id="app"></div>

    <script type="text/javascript" src="mame-loader.js"></script>
    <script type="text/javascript" src="theme-simple.js"></script>
    <script type="text/javascript">
      MAMEThemeSimple.mount(document.getElementById("app"), {
        driver:  "samcoupe",
        files: [
          { url: "roms/samcoupe.zip",   path: "roms/samcoupe.zip" },
          { url: "software/elite.dsk",  path: "elite.dsk" },
        ],
        args: [
          "-window", "-nounevenstretch", "-video", "bgfx", "-bgfx_screen_chains", "unfiltered",
          "-resolution", "576x550",
          "-mouseport", "mouse",
          "-ab", "........................boot\\n",
          "-flop1", "elite.dsk"
        ],
      });
    </script>
  </body>
</html>
