<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>ATM Turbo 2+</title>
  </head>
  <body>
    <div id="app"></div>

    <script type="text/javascript" src="mame-loader.js"></script>
    <script type="text/javascript" src="theme-simple.js"></script>
    <script type="text/javascript">
      MAMEThemeSimple.mount(document.getElementById("app"), {
        driver:  "atmtb2plus",
        files: [
          { url: "roms/atmtb2plus.zip",  path: "roms/atmtb2plus.zip" },
          { url: "roms/betadisk.zip",    path: "roms/betadisk.zip" },
          { url: "software/rubik.trd",   path: "rubik.trd" },
        ],
        args: [
          "-window", "-nounevenstretch", "-video", "bgfx", "-bgfx_screen_chains", "unfiltered",
          "-resolution", "704x592",
          "-bios", "v1.37",
          "-flop1", "rubik.trd"
        ],
        nmi: true,
      });
    </script>
  </body>
</html>
