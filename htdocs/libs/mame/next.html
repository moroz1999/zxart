<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>ZX Spectrum Next</title>
  </head>
  <body>
    <div id="app"></div>

    <script type="text/javascript" src="mame-loader.js"></script>
    <script type="text/javascript" src="theme-simple.js"></script>
    <script type="text/javascript">
      MAMEThemeSimple.mount(document.getElementById("app"), {
        driver:  "tbblue",
        files: [
          { url: "roms/tbblue.zip",    path: "roms/tbblue.zip" },
          { url: "software/next.img",  path: "next.img" },
        ],
        args: [
          "-window", "-nounevenstretch", "-video", "bgfx", "-bgfx_screen_chains", "unfiltered",
          "-resolution", "720x576",
          "-bios", "v30100",
          "-aspect", "2:1",
          "-hard1", "next.img"
        ],
        nmi: true,
      });
    </script>
  </body>
</html>
