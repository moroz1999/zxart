<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>ZX Evolution :: BaseConf</title>
  </head>
  <body>
    <div id="app"></div>

    <script type="text/javascript" src="mame-loader.js"></script>
    <script type="text/javascript" src="theme-simple.js"></script>
    <script type="text/javascript">
      MAMEThemeSimple.mount(document.getElementById("app"), {
        driver:  "pentevo",
        files: [
          { url: "roms/pentevo.zip",               path: "roms/pentevo.zip" },
          { url: "roms/zxbus_neogs.zip",           path: "roms/zxbus_neogs.zip" },
          { url: "roms/betadisk.zip",              path: "roms/betadisk.zip" },
          { url: "software/zxbattlecity_1_4.trd",  path: "zxbattlecity_1_4.trd" },
        ],
        args: [
          "-window", "-nounevenstretch", "-video", "bgfx", "-bgfx_screen_chains", "unfiltered",
          "-resolution", "720x576",
          "-zxbus1", "neogs",
          "-flop1", "zxbattlecity_1_4.trd"
        ],
        nmi: true,
      });
    </script>
  </body>
</html>
