openapi: 3.0.3
info:
  title: ZX-Art password recovery API
  version: 1.0.0
paths:
  /password-reminder-data/:
    post:
      summary: Request a password-reset link or apply a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, email]
              properties:
                action:
                  type: string
                  enum: [request, reset]
                email:
                  type: string
                  format: email
                key:
                  type: string
                password:
                  type: string
                passwordRepeat:
                  type: string
      responses:
        '200':
          description: Reset request accepted or password changed
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid action or reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid email or password confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    PasswordReminderResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    ErrorResponse:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string
