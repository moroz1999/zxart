openapi: 3.0.3
info:
  title: ZX-Art production changes API
  version: 1.0.0
paths:
  /prod-data/:
    post:
      summary: Run one change on a production
      description: |
        The action is selected by `action`. Each one checks the privilege of the
        matching legacy action on the production and is recorded in the actions log.
        - `delete` removes the production; needs `publicDelete`. Answers the deleted id.
        - `deleteMember` removes the author `authorId` from the members (authorship of this entity type only); needs `deleteAuthor`. Answers `404` when the author was not a member.
        - `deleteFile` deletes the file `fileId` of one of the multi-file selectors; the file itself needs `delete`. Answers `404` for a file of another element.
        - `update` changes the production `id` from the multipart body and adds the files of `files[<kind>][]` to their lists; needs `publicReceive`. Answers the id.
        - `batchUpload` makes a production with one release per file of `releaseFiles[]`, all with the values of the body; a production without a title is named after its file. Needs `batchUpload` for upload forms on the root. Answers the ids of the productions.
        A list left out of the body keeps what the element holds; an empty list clears it. A field left out keeps its value.
      parameters:
        - in: query
          name: id
          required: false
          schema:
            type: integer
          description: Id of the production; not sent by the actions that create.
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum: [delete, deleteMember, deleteFile, update, batchUpload]
        - in: query
          name: authorId
          required: false
          schema:
            type: integer
          description: Author to remove; required for `deleteMember`.
        - in: query
          name: fileId
          required: false
          schema:
            type: integer
          description: File to delete; required for `deleteFile`.
      requestBody:
        required: false
        description: Sent by the actions that create or update.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  description: The request as JSON.
                  required: [fields]
                  properties:
                    fields:
                      $ref: '#/components/schemas/Fields'
                    authors:
                      type: array
                      items:
                        $ref: '#/components/schemas/Authorship'
                    importOrigins:
                      description: Not taken by `batchUpload`; an upload through the site has no portal ids.
                      type: array
                      items:
                        $ref: '#/components/schemas/ImportOrigin'
                'files[screenshots][]':
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 'Added to the list of that kind: screenshots, inlays, maps, rzx.'
                'releaseFiles[]':
                  type: array
                  items:
                    type: string
                    format: binary
                  description: '`batchUpload` only: one production per file.'
            encoding:
              data:
                contentType: application/json
      responses:
        '200':
          description: The change is done
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChangeResult'
                  - $ref: '#/components/schemas/CreatedIds'
        '400':
          description: Missing id or action parameter, or unknown action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The visitor lacks the action's privilege on the production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No production with this id, or no such member or file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Not a POST request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The change failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Fields:
      type: object
      description: The editable fields; one left out keeps its value, 0 clears a reference.
      properties:
        title:
          type: string
        altTitle:
          type: string
        year:
          type: integer
        description:
          type: string
        htmlDescription:
          type: boolean
        instructions:
          type: string
        htmlInstructions:
          type: boolean
        legalStatus:
          type: string
        externalLink:
          type: string
        youtubeId:
          type: string
        partyId:
          type: integer
        partyPlace:
          type: integer
        compo:
          type: string
        denyVoting:
          type: boolean
        denyComments:
          type: boolean
        languages:
          type: array
          items:
            type: string
        hardware:
          type: array
          items:
            type: string
        categoryIds:
          type: array
          items:
            type: integer
        groupIds:
          type: array
          items:
            type: integer
        publisherIds:
          type: array
          items:
            type: integer
        tags:
          type: array
          items:
            type: string
        compilationItemIds:
          type: array
          items:
            type: integer
        seriesProdIds:
          type: array
          items:
            type: integer
    Authorship:
      type: object
      required: [authorId]
      properties:
        authorId:
          type: integer
          description: An author or an author alias.
        roles:
          type: array
          items:
            type: string
          description: None stands for an unknown role.
        startDate:
          type: integer
          description: Unix timestamp, 0 for none.
        endDate:
          type: integer
          description: Unix timestamp, 0 for none.
    ImportOrigin:
      type: object
      required: [origin, importId]
      properties:
        origin:
          type: string
          description: Portal code.
        importId:
          type: string
    CreatedIds:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
    ChangeResult:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Id of the element the change produced.
    ErrorResponse:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string
