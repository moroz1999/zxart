openapi: 3.0.3
info:
  title: ZX-Art production changes API
  version: 1.0.0
paths:
  /prod-data/:
    post:
      summary: Run one change on a production
      description: |
        The action is selected by `action`. Each one checks the privilege of the
        matching legacy action on the production and is recorded in the actions log.
        - `delete` removes the production; needs `publicDelete`. Answers the deleted id.
        - `deleteMember` removes the author `authorId` from the members (authorship of this entity type only); needs `deleteAuthor`. Answers `404` when the author was not a member.
        - `deleteFile` deletes the file `fileId` of one of the multi-file selectors; the file itself needs `delete`. Answers `404` for a file of another element.
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
          description: Id of the production.
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum: [delete, deleteMember, deleteFile]
        - in: query
          name: authorId
          required: false
          schema:
            type: integer
          description: Author to remove; required for `deleteMember`.
        - in: query
          name: fileId
          required: false
          schema:
            type: integer
          description: File to delete; required for `deleteFile`.
      responses:
        '200':
          description: The change is done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeResult'
        '400':
          description: Missing id or action parameter, or unknown action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The visitor lacks the action's privilege on the production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No production with this id, or no such member or file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Not a POST request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The change failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ChangeResult:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Id of the element the change produced.
    ErrorResponse:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string
