openapi: 3.0.0
info:
  title: ZxArt User Preferences API
  version: 1.1.0
  description: API for managing user preferences (theme, etc.)

paths:
  /userpreferences/:
    get:
      summary: Get all user preferences
      description: Returns all preferences for the current user, merged with defaults. For anonymous users, returns only defaults.
      responses:
        '200':
          description: List of preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreferenceDto'

    put:
      summary: Update user preferences
      description: Updates one preference or an atomic batch for the current user. The response contains the complete effective preference snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - preferences
              properties:
                preferences:
                  type: array
                  items:
                    $ref: '#/components/schemas/PreferenceDto'
      responses:
        '200':
          description: Updated list of preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreferenceDto'
        '400':
          description: Malformed request or invalid preference code or value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PreferenceDto:
      type: object
      properties:
        code:
          type: string
          description: Preference code
          example: "theme"
        value:
          type: string
          description: Preference value
          example: "light"
      required:
        - code
        - value

    ErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          description: Error message
      required:
        - errorMessage
