openapi: 3.0.0
info:
  title: ZxArt User Preferences API
  version: 1.0.0
  description: API for managing user preferences (theme, etc.)

paths:
  /userpreferences/:
    get:
      summary: Get all user preferences
      description: Returns all preferences for the current user, merged with defaults. For anonymous users, returns only defaults.
      responses:
        '200':
          description: List of preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreferenceDto'

    put:
      summary: Update user preferences
      description: Updates one preference or a batch for the current user. For anonymous users, changes are not persisted server-side.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - type: object
                  properties:
                    code:
                      type: string
                      description: Preference code
                    value:
                      type: string
                      description: Preference value
                  required:
                    - code
                    - value
                - type: object
                  properties:
                    batch:
                      type: string
                      description: JSON array of objects containing string code and value fields
                      example: '[{"code":"homepage_order","value":"newProds,bestTunesOfMonth"},{"code":"homepage_best_tunes_month_limit","value":"10"}]'
                  required:
                    - batch
      responses:
        '200':
          description: Updated list of preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreferenceDto'
        '400':
          description: Invalid preference code, value, or batch format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PreferenceDto:
      type: object
      properties:
        code:
          type: string
          description: Preference code
          example: "theme"
        value:
          type: string
          description: Preference value
          example: "light"
      required:
        - code
        - value

    ErrorResponse:
      type: object
      properties:
        errorMessage:
          type: string
          description: Error message
      required:
        - errorMessage
