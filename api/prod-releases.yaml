openapi: 3.0.0
paths:
  /prod-releases/:
    get:
      summary: List of releases for a zxProd
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Releases payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdReleasesPayload'
        '400':
          description: Bad request
        '404':
          description: Prod not found
        '500':
          description: Internal server error

components:
  schemas:
    ProdReleasesPayload:
      type: object
      required:
        - releases
      properties:
        releases:
          type: array
          items:
            $ref: '#/components/schemas/ProdRelease'

    ProdRelease:
      type: object
      required:
        - id
        - title
        - url
        - year
        - version
        - releaseType
        - releaseTypeLabel
        - hardwareRequired
        - description
        - isRealtime
        - party
        - languages
        - hardware
        - releaseBy
        - formats
        - isDownloadable
        - isPlayable
        - downloadUrl
        - playUrl
        - fileName
        - emulatorType
        - launchFileId
        - launchFilePath
        - prodLegalStatus
        - prodExternalLink
        - downloadsCount
        - playsCount
        - voting
        - externalLinks
        - screenshots
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
        year:
          type: integer
        version:
          type: string
        releaseType:
          type: string
        releaseTypeLabel:
          type: string
          nullable: true
        hardwareRequired:
          type: array
          items:
            type: string
        description:
          type: string
          description: HTML-entity-decoded sanitized HTML description content without API-added presentation wrapper markup.
        isRealtime:
          type: boolean
        party:
          oneOf:
            - $ref: 'prod-details.yaml#/components/schemas/ProdPartyInfo'
            - type: 'null'
          nullable: true
        languages:
          type: array
          items:
            $ref: 'prod-details.yaml#/components/schemas/ProdLanguageInfo'
        hardware:
          type: array
          items:
            $ref: 'prod-details.yaml#/components/schemas/ProdHardwareInfo'
        releaseBy:
          type: array
          items:
            $ref: 'prod-details.yaml#/components/schemas/ProdGroupRef'
        formats:
          type: array
          items:
            $ref: '#/components/schemas/ProdReleaseFormat'
        isDownloadable:
          type: boolean
        isPlayable:
          type: boolean
        downloadUrl:
          type: string
          nullable: true
        playUrl:
          type: string
          nullable: true
        fileName:
          type: string
          nullable: true
        emulatorType:
          type: string
          nullable: true
        launchFileId:
          description: >-
            Parsed-structure id of the file the emulator should start. Set only
            for emulators handed the release file whole; null when the release
            holds nothing the emulator can run.
          type: integer
          nullable: true
        launchFilePath:
          description: >-
            That file's path inside the release file, as the emulator meets it
            unpacked. The bare name when the release is a single file.
          type: string
          nullable: true
        prodLegalStatus:
          type: string
        prodExternalLink:
          type: string
        downloadsCount:
          type: integer
        playsCount:
          type: integer
        voting:
          $ref: 'prod-details.yaml#/components/schemas/ProdVoting'
        externalLinks:
          type: array
          items:
            $ref: 'prod-details.yaml#/components/schemas/ProdLinkInfo'
        screenshots:
          type: array
          items:
            $ref: 'prod-files.yaml#/components/schemas/ProdFile'

    ProdReleaseFormat:
      type: object
      required:
        - format
        - emoji
      properties:
        format:
          type: string
        emoji:
          type: string
