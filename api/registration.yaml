openapi: 3.0.3
info:
  title: ZX-Art registration API
  version: 1.0.0
paths:
  /register-data/:
    post:
      summary: Register a user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
        '409':
          description: Account already exists or the requester is authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid registration fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Registration is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    RegistrationRequest:
      type: object
      required: [userName, email, password, passwordRepeat]
      properties:
        userName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        passwordRepeat:
          type: string
    RegistrationResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    ErrorResponse:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string
