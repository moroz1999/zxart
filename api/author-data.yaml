openapi: 3.0.3
info:
  title: ZX-Art author changes API
  version: 1.0.0
paths:
  /author-data/:
    post:
      summary: Run one change on an author
      description: |
        The action is selected by `action`. Each one checks the privilege of the
        matching legacy action on the author and is recorded in the actions log.
        - `delete` removes the author; needs `publicDelete`. Answers the deleted id.
        - `convertToGroup` turns the author into a new group, moving its works, links and import origins, and deletes the author; needs `convertToGroup`. Answers the created entity's id.
        - `create` adds an author from the multipart body; needs `publicAdd` for authors on the root. Answers the new id.
        - `update` changes the author `id` from the multipart body; needs `publicReceive`. Answers the id.
        A list left out of the body keeps what the element holds; an empty list clears it. A field left out keeps its value.
      parameters:
        - in: query
          name: id
          required: false
          schema:
            type: integer
          description: Id of the author; not sent by the actions that create.
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum: [delete, convertToGroup, create, update]
      requestBody:
        required: false
        description: Sent by the actions that create or update.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  description: The request as JSON.
                  required: [fields]
                  properties:
                    fields:
                      $ref: '#/components/schemas/Fields'
                    realNames:
                      type: object
                      additionalProperties:
                        type: string
                      description: language id => real name in that language
                    groups:
                      type: array
                      items:
                        $ref: '#/components/schemas/Membership'
                    prods:
                      type: array
                      items:
                        $ref: '#/components/schemas/Membership'
                    importOrigins:
                      type: array
                      items:
                        $ref: '#/components/schemas/ImportOrigin'
                    removeImage:
                      type: boolean
                image:
                  type: string
                  format: binary
                  description: The author image; replaces the stored one.
            encoding:
              data:
                contentType: application/json
      responses:
        '200':
          description: The change is done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeResult'
        '400':
          description: Missing id, unknown action, a malformed body, a wrong reference or role, or a refused file; nothing is changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The visitor lacks the action's privilege on the author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No author with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Not a POST request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The change failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Fields:
      type: object
      description: The editable fields; one left out keeps its value, 0 clears a reference.
      properties:
        title:
          type: string
        countryId:
          type: integer
        cityId:
          type: integer
        wikiLink:
          type: string
        zxTunesId:
          type: integer
        denyVoting:
          type: boolean
        denyComments:
          type: boolean
        deny3a:
          type: boolean
        displayInMusic:
          type: boolean
        displayInGraphics:
          type: boolean
        chipType:
          type: string
        channelsType:
          type: string
        frequency:
          type: string
        intFrequency:
          type: string
        palette:
          type: string
    Membership:
      type: object
      required: [elementId]
      properties:
        elementId:
          type: integer
        roles:
          type: array
          items:
            type: string
          description: None stands for an unknown role.
        startDate:
          type: integer
          description: Unix timestamp, 0 for none.
        endDate:
          type: integer
          description: Unix timestamp, 0 for none.
    ImportOrigin:
      type: object
      required: [origin, importId]
      properties:
        origin:
          type: string
          description: Portal code.
        importId:
          type: string
    ChangeResult:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Id of the element the change produced.
    ErrorResponse:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string
