openapi: 3.0.3
info:
  title: ZX-Art group changes API
  version: 1.0.0
paths:
  /group-data/:
    post:
      summary: Run one change on a group
      description: |
        The action is selected by `action`. Each one checks the privilege of the
        matching legacy action on the group and is recorded in the actions log.
        - `delete` removes the group; needs `publicDelete`. Answers the deleted id.
        - `deleteMember` removes the author `authorId` from the members (authorship of this entity type only); needs `deleteAuthor`. Answers `404` when the author was not a member.
        - `convertToAuthor` turns the group into a new author, moving its works, links and import origins, and deletes the group; needs `convertToAuthor`. Answers the created entity's id.
        - `create` adds a group from the multipart body; needs `publicAdd` for groups on the root. Answers the new id.
        - `update` changes the group `id` from the multipart body; needs `publicReceive`. Answers the id.
        A list left out of the body keeps what the element holds; an empty list clears it. A field left out keeps its value.
      parameters:
        - in: query
          name: id
          required: false
          schema:
            type: integer
          description: Id of the group; not sent by the actions that create.
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum: [delete, convertToAuthor, deleteMember, create, update]
        - in: query
          name: authorId
          required: false
          schema:
            type: integer
          description: Author to remove; required for `deleteMember`.
      requestBody:
        required: false
        description: Sent by the actions that create or update.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  description: The request as JSON.
                  required: [fields]
                  properties:
                    fields:
                      $ref: '#/components/schemas/Fields'
                    members:
                      type: array
                      items:
                        $ref: '#/components/schemas/Authorship'
                    importOrigins:
                      type: array
                      items:
                        $ref: '#/components/schemas/ImportOrigin'
                    removeImage:
                      type: boolean
                image:
                  type: string
                  format: binary
                  description: The group logo; replaces the stored one.
            encoding:
              data:
                contentType: application/json
      responses:
        '200':
          description: The change is done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeResult'
        '400':
          description: Missing id or action parameter, or unknown action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The visitor lacks the action's privilege on the group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No group with this id, or no such member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Not a POST request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The change failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Fields:
      type: object
      description: The editable fields; one left out keeps its value, 0 clears a reference.
      properties:
        title:
          type: string
        abbreviation:
          type: string
        type:
          type: string
        countryId:
          type: integer
        cityId:
          type: integer
        website:
          type: string
        wikiLink:
          type: string
        slogan:
          type: string
        startDate:
          type: integer
        endDate:
          type: integer
        subGroupIds:
          type: array
          items:
            type: integer
    Authorship:
      type: object
      required: [authorId]
      properties:
        authorId:
          type: integer
          description: An author or an author alias.
        roles:
          type: array
          items:
            type: string
          description: None stands for an unknown role.
        startDate:
          type: integer
          description: Unix timestamp, 0 for none.
        endDate:
          type: integer
          description: Unix timestamp, 0 for none.
    ImportOrigin:
      type: object
      required: [origin, importId]
      properties:
        origin:
          type: string
          description: Portal code.
        importId:
          type: string
    ChangeResult:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Id of the element the change produced.
    ErrorResponse:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string
