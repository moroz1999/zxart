openapi: 3.0.0
info:
  title: Page Metadata API
  version: 1.0.0
paths:
  /page-metadata/:
    get:
      summary: Get route metadata for the public SPA
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Metadata for the requested route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMetadataDto'
        '500':
          description: Internal server error
components:
  schemas:
    PageMetadataDto:
      type: object
      required: [title, description, noIndex, openGraph, twitter, languageLinks, structuredData]
      properties:
        title:
          type: string
        description:
          type: string
        noIndex:
          type: boolean
        openGraph:
          type: object
          additionalProperties:
            type: string
        twitter:
          type: object
          additionalProperties:
            type: string
        languageLinks:
          type: object
          additionalProperties:
            type: string
        structuredData:
          nullable: true
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
