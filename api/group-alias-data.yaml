openapi: 3.0.3
info:
  title: ZX-Art group alias changes API
  version: 1.0.0
paths:
  /group-alias-data/:
    post:
      summary: Run one change on a group alias
      description: |
        The action is selected by `action`. Each one checks the privilege of the
        matching legacy action on the group alias and is recorded in the actions log.
        - `delete` removes the group alias; needs `publicDelete`. Answers the deleted id.
        - `convertToGroup` turns the alias into a standalone group and deletes the alias; needs `convertToGroup`. Answers the created entity's id.
        - `create` adds an alias to the group `fields.groupId` from the multipart body; needs `publicAdd` for aliases on that group. Answers the new id.
        - `update` changes the alias `id` from the multipart body; needs `publicReceive`. Answers the id.
        A list left out of the body keeps what the element holds; an empty list clears it. A field left out keeps its value.
      parameters:
        - in: query
          name: id
          required: false
          schema:
            type: integer
          description: Id of the group alias; not sent by the actions that create.
        - in: query
          name: action
          required: true
          schema:
            type: string
            enum: [delete, convertToGroup, create, update]
      requestBody:
        required: false
        description: Sent by the actions that create or update.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  description: The request as JSON.
                  required: [fields]
                  properties:
                    fields:
                      $ref: '#/components/schemas/Fields'
                    members:
                      type: array
                      items:
                        $ref: '#/components/schemas/Authorship'
                    importOrigins:
                      type: array
                      items:
                        $ref: '#/components/schemas/ImportOrigin'
            encoding:
              data:
                contentType: application/json
      responses:
        '200':
          description: The change is done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeResult'
        '400':
          description: Missing id, unknown action, a malformed body, a wrong reference or role, or a refused file; nothing is changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The visitor lacks the action's privilege on the group alias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No group alias with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Not a POST request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The change failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Fields:
      type: object
      description: The editable fields; one left out keeps its value, 0 clears a reference.
      properties:
        title:
          type: string
        groupId:
          type: integer
        startDate:
          type: integer
        endDate:
          type: integer
    Authorship:
      type: object
      required: [authorId]
      properties:
        authorId:
          type: integer
          description: An author or an author alias.
        roles:
          type: array
          items:
            type: string
          description: None stands for an unknown role.
        startDate:
          type: integer
          description: Unix timestamp, 0 for none.
        endDate:
          type: integer
          description: Unix timestamp, 0 for none.
    ImportOrigin:
      type: object
      required: [origin, importId]
      properties:
        origin:
          type: string
          description: Portal code.
        importId:
          type: string
    ChangeResult:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Id of the element the change produced.
    ErrorResponse:
      type: object
      required: [errorMessage]
      properties:
        errorMessage:
          type: string
