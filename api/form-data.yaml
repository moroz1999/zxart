openapi: 3.0.0
paths:
  /formdata/:
    get:
      summary: Load an Angular form
      parameters:
        - in: query
          name: id
          schema:
            type: integer
          description: Existing entity identifier.
        - in: query
          name: entityType
          schema:
            type: string
            enum:
              - author
              - group
              - party
              - prodBatch
              - pictureBatch
              - musicBatch
              - release
              - pressArticle
          description: Creation form type; used instead of id.
        - in: query
          name: year
          schema:
            type: integer
          description: Required for a party creation form.
        - in: query
          name: parentId
          schema:
            type: integer
          description: >
            Element the form was started from. Batch uploads attach their works to
            it (author, group, party or production category); a release and a
            press article require the production id. Echoed back as `parent`.
        - in: query
          name: refs
          schema:
            type: string
          description: Comma-separated relation fields to resolve.
      responses:
        '200':
          description: Form values and supporting options
          content:
            application/json:
              schema:
                type: object
                required:
                  - entityTitle
                properties:
                  entityTitle:
                    type: string
                    description: Localized display title of the existing entity; empty for a creation draft.
                  parent:
                    nullable: true
                    type: object
                    description: >
                      The element this form's entity belongs to: on a creation form
                      the one it was started from, so the form can prefill the field
                      it belongs in; on an edit form the entity's first parent, which
                      names the page and takes the user in once the entity is deleted.
                    required:
                      - id
                      - title
                      - structureType
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      structureType:
                        type: string
                  tags:
                    type: array
                    description: >
                      Titles of the tags linked to the item, as the form lists
                      them. Empty for entities that carry no tags. The whole list
                      is submitted back under the same name.
                    items:
                      type: string
                  importOrigins:
                    type: array
                    description: >
                      Ids the entity carries on external portals, in the order the
                      form lists them. Empty for entities that carry none. The
                      portals to choose from arrive as the `importOrigins` enum;
                      the whole list is submitted back under the same name.
                    items:
                      type: object
                      required:
                        - origin
                        - importId
                      properties:
                        origin:
                          type: string
                          description: Portal code.
                        importId:
                          type: string
                          description: Id the entity has on that portal.
                  enums:
                    type: object
                    description: >
                      Select options keyed by field. Most carry a backend label.
                      Options the SPA still names itself — software `language` —
                      repeat their code in both value and label. Hardware options
                      additionally carry `group`, the category they belong to, so
                      the picker can render them grouped; their labels come from
                      the editable hardware catalog.
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required:
                          - value
                          - label
                        properties:
                          value:
                            type: string
                          label:
                            type: string
                          group:
                            type: string
                            description: Only on grouped enums (hardware).
                additionalProperties: true
        '400':
          description: Missing id or required creation context
        '401':
          description: A creation form was requested by an anonymous visitor
        '403':
          description: Opening the form is forbidden
        '404':
          description: Existing entity or requested party year not found
        '500':
          description: Internal server error
    post:
      summary: Create an entity from an Angular form
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - entityType
                - fields
              properties:
                entityType:
                  type: string
                  enum:
                    - author
                    - group
                    - party
                    - prodBatch
                    - pictureBatch
                    - musicBatch
                    - release
                    - pressArticle
                year:
                  type: integer
                  description: Required for a party; identifies its parent year.
                parentId:
                  type: integer
                  description: >
                    Element the works are created under (author, group or party for
                    a batch upload, the production for a release or a press article).
                fields:
                  type: object
                  additionalProperties: true
                  description: >
                    Form values and uploaded files keyed by entity field name.
                    A release form sends its files as `fields[file][]` and gains
                    one release per file, all carrying the other values.
      responses:
        '200':
          description: Created entity identifier
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: integer
                  ids:
                    type: array
                    items:
                      type: integer
                    description: >
                      Every element the submit created, when a form creates more
                      than one: a release form creates one release per uploaded
                      file, in upload order, and `id` is the first of them.
        '400':
          description: Unsupported entity type or missing required creation context
        '401':
          description: The submission came from an anonymous visitor
        '403':
          description: Creation is forbidden or failed
        '422':
          description: >
            The submitted values were rejected by the element's validators and
            nothing was created.
        '500':
          description: Internal server error
