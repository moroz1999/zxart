openapi: 3.0.0
paths:
  /author-alias-form/:
    get:
      summary: Load the author alias creation form
      description: The alias itself is created through `/author-alias-data/` (`create`).
      parameters:
        - in: query
          name: authorId
          required: true
          schema:
            type: integer
          description: Main author that will own the alias.
      responses:
        '200':
          description: Form context
          content:
            application/json:
              schema:
                type: object
                required:
                  - author
                properties:
                  author:
                    $ref: '#/components/schemas/EntityRef'
        '400':
          description: Missing author identifier
        '403':
          description: Alias creation is forbidden
        '404':
          description: Author not found
        '500':
          description: Internal server error
components:
  schemas:
    EntityRef:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: integer
        title:
          type: string
